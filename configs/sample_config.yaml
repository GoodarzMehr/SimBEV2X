rsu_semantic_lidar_properties:
  rotation_frequency: '20.0'   # rotation frequency, in Hz
  points_per_second: '2621440' # number of points generated per second
  upper_fov: '0.0'             # upper field of view angle, in degrees
  lower_fov: '-45.0'           # lower field of view angle, in degrees
  horizontal_fov: '180.0'      # horizontal field of view, in degrees

# The following parameters control whether RSUs use radars, and if so, the
# range, field of view, and other properties of the radars.
use_rsu_radar: True

rsu_radar_range: 120.0          # range, in meters
rsu_radar_horizontal_fov: 120.0 # horizontal field of view, in degrees
rsu_radar_vertical_fov: 20.0    # vertical field of view, in degrees
rsu_radar_properties:
  points_per_second: '48000'    # number of points generated per second

# The following parameters control whether data RSUs use the voxel detector,
# and if so, the properties of the voxel detector. The voxel detector provides
# 3D semantic information in the form of a 3D voxel grid surrounding each RSU.
# If 'full_sweep' is set to true, the voxel detector checks each voxel in the
# grid individually to see if it overlaps with the mesh of an object in the
# environment. If so, the class of that object is assigned to said voxel.
# However, this can be computationally expensive. If 'full_sweep' is set to
# false, the voxel detector instead sweeps voxel-sized boxes in each
# column/row of the specified axis-aligned directions and records the first
# hit of that box sweep with each object in its path, in essence capturing the
# surface voxels of those objects in the specified directions. 'z_fill_mode'
# can be set to 'BoxSweep', (requires 'use_z_top' to be true), which checks
# each voxel below the first hit in each column, similar to when 'full_sweep'
# is true. 'z_fill_mode' can also be set to 'Scanline' (requires both
# 'use_z_top' and 'use_z_bottom' to be true), which fills in all voxels
# between the topmost and bottommost hits of each object in each column.
use_rsu_voxel_detector: True

rsu_voxel_detector_range: 64.0        # extent of the voxel detection grid in
                                      # each of the four x and y directions,
                                      # in meters (the covered area is a
                                      # square with 2 * 'voxel_detector_range'
                                      # sides)
rsu_voxel_size: 0.1                   # size of each voxel, in meters
rsu_voxel_detector_upper_limit: 7.0   # upper limit of the voxel detection
                                      # grid, in meters
rsu_voxel_detector_lower_limit: -1.0  # lower limit of the voxel detection
                                      # grid, inmeters
rsu_voxel_detector_properties:
  ignore_self: 'False'           # whether to ignore the ego vehicle when
                                 # creating the voxel grid
  show_calculation_time: 'False' # Whether to print the time it takes to
                                 # calculate the voxel grid at each time step
  use_complex_collision: 'True'  # whether to use complex collisions for more
                                 # accurate results
  full_sweep: 'True'             # whether to sweep each voxel in the grid
                                 # individually
  z_fill_mode: 'None'            # how to fill in voxels along the z axis; can
                                 # be 'None', 'BoxSweep', or 'Scanline'
  use_x_front: 'False'           # whether to sweep along the x axis from
                                 # front to back
  use_x_back: 'False'            # whether to sweep along the x axis from back
                                 # to front
  use_y_right: 'False'           # whether to sweep along the y axis from
                                 # right to left
  use_y_left: 'False'            # whether to sweep along the y axis from left
                                 # to right
  use_z_top: 'False'             # whether to sweep along the z axis from top
                                 # to bottom
  use_z_bottom: 'False'          # whether to sweep along the z axis from
                                 # bottom to top

########## Optional Settings ##########

# The following parameter controls the change in street light intensity. For
# it to take effect, 'change_street_light_intensity' must be true. If this
# value is not provided, then the change in street light intensity is chosen
# randomly for each scene.
# street_light_intensity_change: 200000.0 # intensity, in lumens

# The following parameters control the number of vehicles and pedestrians that
# are spawned in each scene. If these values are not provided, they are chosen
# randomly for each scene.
# n_vehicles: 100
# n_walkers: 100

# The following parameter controls the portion of pedestrians that can walk on
# the road in places other than a crosswalk. If it is not provided, it is
# chosen randomly for each scene.
# walker_cross_factor: 0.6

# The following parameters control traffic behavior. If any of these are not
# provided, they are chosen randomly for each scene.
# speed_difference: -10.0  # the percentage difference between each vehicle's
#                          # intended speed and the speed limit; negative
#                          # values indicate speeds higher than the speed
#                          # limit
# distance_to_leading: 4.0 # minimum distance each vehicle has to maintain
