# The following parameters control the (initial and final, if dynamic weather
# is enabled) weather. Any subset of these parameters can be provided, and the
# ones that are not provided are chosen randomly for each scene. Other weather
# parameters supported by CARLA can be used as well.
# initial_weather:
#   cloudiness: 10.0             # cloud cover, values range from 0 (clear
#                                # sky) to 100
#   precipitation: 0.0           # rain intensity, values range from 0 (no
#                                # rain) to 100
#   precipitation_deposits: 10.0 # amount of water (puddles) on the ground,
#                                # values range from 0 (dry road) to 100
                                 # (covered in water)
#   wind_intensity: 10.0         # intensity of the wind, values range from 0
#                                # (no wind) to 100
#   sun_azimuth_angle: 300.0     # azimuth angle of the sun, in degrees;
#                                # values range from 0 to 360
#   sun_altitude_angle: 20.0     # altitude angle of the sun, in degrees;
#                                # values range from -90 to 90
#   wetness: 0.0                 # intensity of camera wetness, values range
#                                # from 0 (dry camera) to 100
#   fog_density: 2.0             # fog concentration or thickness, values
#                                # range from 0 (no fog) to 100
#   fog_distance: 0.75           # distance where the fog starts, values
#                                # greater than 0
#   fog_falloff: 0.1             # heaviness (specific mass) of the fog,
#                                # values greater than 0; at 0 the fog is
#                                # lighter than air, at 1 the fog has about
#                                # the same heaviness as air, at 5 and above
#                                # the fog is so heavy that it is compressed
#                                # to the ground
#
# final_weather:
#   cloudiness: 100.0
#   precipitation: 100.0
#   precipitation_deposits: 100.0
#   wind_intensity: 100.0
#   sun_azimuth_angle: 0.0
#   sun_altitude_angle: -20.0
#   wetness: 100.0
#   fog_density: 100.0
#   fog_distance: 1
#   fog_falloff: 0.1

